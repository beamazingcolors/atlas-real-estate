<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="atlasCyan" x1="128" y1="16" x2="218" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#005f9e" />
      <stop offset="45%" stop-color="#00b4f5" />
      <stop offset="100%" stop-color="#0077cc" />
    </linearGradient>
    <linearGradient id="atlasTowerBlue" x1="128" y1="88" x2="148" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00c2ff" />
      <stop offset="100%" stop-color="#00589c" />
    </linearGradient>
  </defs>

  <!-- Edificios centrales dentro de la A -->
  <!-- Torre izquierda -->
  <polygon points="96,136 112,124 112,178 96,184" fill="#091e3a" />
  <polygon points="112,124 118,128 118,175 112,178" fill="#cbd5e1" />

  <!-- Torre central principal -->
  <polygon points="114,106 130,94 130,170 114,177" fill="#091e3a" />
  <polygon points="130,94 144,105 144,164 130,170" fill="url(#atlasTowerBlue)" />
  <!-- Ventanas torre central -->
  <rect x="118" y="108" width="3.5" height="6" rx="0.5" fill="#ffffff" />
  <rect x="123.5" y="105" width="3.5" height="6" rx="0.5" fill="#ffffff" />
  <rect x="118" y="117" width="3.5" height="6" rx="0.5" fill="#ffffff" />
  <rect x="123.5" y="114" width="3.5" height="6" rx="0.5" fill="#ffffff" />
  <rect x="118" y="126" width="3.5" height="6" rx="0.5" fill="#ffffff" />
  <rect x="123.5" y="123" width="3.5" height="6" rx="0.5" fill="#ffffff" />

  <!-- Torre derecha -->
  <polygon points="138,134 148,125 148,162 138,166" fill="#e2e8f0" />
  <polygon points="148,125 158,133 158,158 148,162" fill="#091e3a" />

  <!-- Estructura izquierda Navy de la A + Travesaño ascendente -->
  <path
    d="M128 14 L121 58 L38 232 L86 232 L101 198 L166 170 L160 156 L80 190 L128 84 Z"
    fill="#091e3a"
  />
  <!-- Línea interior blanca/espacio negativo del brazo izquierdo -->
  <path
    d="M124 72 L64 204 L158 164 L162 172 L52 218 L124 62 Z"
    fill="#ffffff"
  />

  <!-- Aguja central y ala derecha Cyan/Azul de la A -->
  <polygon points="128,14 136,78 128,70" fill="#0077cc" />
  <polygon points="138,68 220,232 198,232 134,92" fill="url(#atlasCyan)" />

  <!-- Base derecha Navy y faceta azul interna -->
  <polygon points="166,170 198,232 152,232 138,200 150,194 162,216 180,216 158,174" fill="#091e3a" />
  <polygon points="150,194 180,216 162,216" fill="#0088dd" />
</svg>
